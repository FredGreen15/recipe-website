name: Deploy Django backend to Azure Web App

on:
  push:
    branches:
      - master
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Zip backend folder
        run: |
          cd backend
          zip -r ../deploy.zip . -x "*.pyc" -x "*/__pycache__/*" -x "db.sqlite3"

      - name: Deploy to Azure Web App
        run: |
          az webapp deploy \
            --name recipe-website-backend \
            --resource-group recipe-website-rg \
            --src-path deploy.zip \
            --type zip
